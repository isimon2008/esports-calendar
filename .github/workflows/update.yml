name: 更新赛程数据
on:
  schedule:
    - cron: "17 */3 * * *"   # 每 3 小时抓一次 Liquipedia
  workflow_dispatch:          # 也可以在 Actions 页面手动运行
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 fetch_data.py
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "update data $(date -u +%F_%H:%M)"
          git push
